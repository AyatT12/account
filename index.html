        /* Style the container */

        .number-input-container {
            display: inline-flex;
            align-items: center;
            border: 2px solid #ff9626;
            border-radius: 8px;
            overflow: hidden;
        }

        .number-input-container.disabled {
            display: inline-flex;
            align-items: center;
            border: 2px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
        }

        /* Style the buttons with arrows */
        .number-input-container button {
            background-color: transparent;
            border: none;
            padding: 2px;
            margin: 0px 0px 0px 7px;
            cursor: pointer;
            font-size: 9px;
            display: inline-block;
            text-align: center;
            line-height: 1;
        }

        .number-input-container button:hover {

        /* Up arrow */

            width: 15px;
            height: 15px;
            background-image: url("./images/up.svg");
            background-size: contain;
            background-repeat: no-repeat;
            border: none;
            cursor: pointer;
            background-position: center;
        }

        .increment::before {

        }

        /* Down arrow */

            width: 15px;
            height: 15px;
            background-image: url(./images/down1.svg);
            background-size: contain;
            background-repeat: no-repeat;
            border: none;
            cursor: pointer;

    <!-- local scripts  Profile photo change-->
    <script>
        const changeProfileBtn = document.getElementById('change-profile-btn');
        const ProfilePhotoInput = document.getElementById('Profile-photo-input');
        const ProfilePhoto = document.getElementById('Profile-photo');

        changeProfileBtn.addEventListener('click', function () {
            ProfilePhotoInput.click();

        })
        var loadFile = function (event) {
            var reader = new FileReader();
            reader.onload = function () {
                var output = document.getElementById('Profile-photo');
                output.src = reader.result;
            };
            reader.readAsDataURL(event.target.files[0]);
        };
    </script>

    <!-- local scripts  increment / decrement -->

    <script>
        let deincrement = document.querySelector(".deincrement");
        let increment = document.querySelector(".increment");
        let number = document.querySelector(".alert-input");

        let step = 5;
        let max = 15;
        let min = 5;

        number.addEventListener('blur', () => {
            let currentValue = parseInt(number.value);
            if (isNaN(currentValue)) {
                number.value = min;
            } else if (currentValue > max) {
                number.value = max;
            } else if (currentValue < min) {
                number.value = min;
            }
        });

        increment.addEventListener("click", () => {
            if (parseInt(number.value) + step >= max) {
                number.value = max;
                increment.style.backgroundImage = "url('images/up1.svg')";
                deincrement.style.backgroundImage = "url('images/down.svg')";
                return;
            }
            increment.style.backgroundImage = "url('images/up.svg')";
            deincrement.style.backgroundImage = "url('images/down.svg')";
            number.value = parseInt(number.value) + step;
        });

        deincrement.addEventListener("click", () => {
            if (parseInt(number.value) - step <= min) {
                number.value = min;
                deincrement.style.backgroundImage = "url('images/down1.svg')";
                increment.style.backgroundImage = "url('images/up.svg')";
                return;
            }
            deincrement.style.backgroundImage = "url('images/down.svg')";
            increment.style.backgroundImage = "url('images/up.svg')";
            number.value = parseInt(number.value) - step;
        });
    </script>
